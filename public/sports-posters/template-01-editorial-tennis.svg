<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600" viewBox="0 0 400 600">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap');
.serif { font-family: 'Playfair Display', Georgia, serif; }
.bebas { font-family: 'Bebas Neue', Impact, sans-serif; }
.mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
.sans { font-family: 'Inter', system-ui, sans-serif; }</style>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="35%" stop-color="#7B1FA2"/>
      <stop offset="65%" stop-color="#FF6F00"/>
      <stop offset="100%" stop-color="#1A237E"/>
    </linearGradient>
    <pattern id="halftone" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="rgba(0,0,0,0.45)"/>
    </pattern>
    <radialGradient id="bloom" cx="30%" cy="25%" r="50%">
      <stop offset="0%" stop-color="rgba(255,235,200,0.35)"/>
      <stop offset="100%" stop-color="rgba(255,235,200,0)"/>
    </radialGradient>
    <radialGradient id="warmVignette" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="rgba(255,240,210,0.5)"/>
      <stop offset="100%" stop-color="rgba(255,240,210,0)"/>
    </radialGradient>
    <pattern id="paper" x="0" y="0" width="3" height="3" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.5" fill="rgba(60,40,20,0.05)"/>
    </pattern>
    <linearGradient id="goldRule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9b7f3a"/>
      <stop offset="50%" stop-color="#d4b76a"/>
      <stop offset="100%" stop-color="#9b7f3a"/>
    </linearGradient>
  </defs>

  <rect width="400" height="600" fill="#EFEAE0"/>
  <rect width="400" height="600" fill="url(#paper)"/>
  <rect width="400" height="600" fill="url(#warmVignette)" style="mix-blend-mode:multiply"/>

  
    <g>
      <line x1="0" y1="60" x2="400" y2="60" stroke="#1a1612" stroke-width="0.5"/>
      <rect x="22" y="22" width="32" height="22" fill="none" stroke="#1a1612" stroke-width="1.2"/>
      <text class="bebas" x="38" y="38" text-anchor="middle" font-size="14" fill="#1a1612" letter-spacing="0.04em">ATP</text>
      <text class="bebas" x="62" y="32" font-size="13" fill="#1a1612" letter-spacing="0.1em">GRAND SLAM</text>
      <text class="mono" x="62" y="44" font-size="7" fill="#6b5d48" letter-spacing="2.5">TENNIS</text>
      <text class="serif" x="378" y="38" text-anchor="end" font-style="italic" font-size="11" fill="#6b5d48">№ 2026.07.13</text>
    </g>
  
    <g>
      <rect x="22" y="76" width="356" height="230" fill="url(#plateGrad)"/>
      <rect x="22" y="76" width="356" height="230" fill="url(#halftone)" style="mix-blend-mode:multiply"/>
      <rect x="22" y="76" width="356" height="230" fill="url(#bloom)"/>
      
    <g transform="translate(125.0 116.0) scale(1.5)"
       fill="none" stroke="rgba(255,240,220,0.95)" stroke-width="2.0"
       color="rgba(255,240,220,0.95)" opacity="1.0">
      
        <circle cx="50" cy="50" r="34"/>
        <path d="M22,32 Q50,50 22,68"/>
        <path d="M78,32 Q50,50 78,68"/>
    
    </g>
      <rect x="22" y="76" width="356" height="230" fill="rgba(0,0,0,0)" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
      <rect x="34" y="84" width="64" height="14" fill="rgba(15,12,10,0.78)"/>
      <text class="sans" x="66" y="94" text-anchor="middle" font-size="7" fill="#EFEAE0" letter-spacing="1.5" font-weight="700">PLATE I — LIVE</text>
    </g>
  <text class="sans" x="22" y="328" font-size="9" fill="#9b7f3a" letter-spacing="2.5" font-weight="700">— A GRAND SLAM FEATURE</text>
  
    <g>
      <text class="serif" x="22" y="372" font-size="42" font-style="italic" fill="#1a1612" letter-spacing="-1">Alcaraz</text>
      <text class="serif" x="22" y="416" font-size="22" fill="#9b7f3a">·</text>
      <text class="serif" x="42" y="416" font-size="42" font-weight="700" fill="#1a1612" letter-spacing="-1">Sinner</text>
    </g>
  <text class="serif" x="22" y="456" font-size="12" font-style="italic" fill="#4a3d2e">Gentlemen&apos;s Final, written from Centre Court · All England Club.</text>
  <text class="serif" x="22" y="472" font-size="12" font-style="italic" fill="#4a3d2e">On the evening of 2026-07-13.</text>
  <rect x="22" y="540" width="356" height="1" fill="url(#goldRule)"/>
  
    <text class="sans" x="22" y="582" font-size="8.5" fill="#1a1612" letter-spacing="1.6" font-weight="600">CENTRE COURT · ALL ENGLAND CLUB</text>
    <text class="serif" x="378" y="582" text-anchor="end" font-style="italic" font-size="12" fill="#9b7f3a">14:00 BST</text>
</svg>