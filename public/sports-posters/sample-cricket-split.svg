  <text x="42" y="56" font-family="Arial Black, Arial, sans-serif" font-size="22" fill="#fff">CRICKET</text>
  <text x="42" y="86" font-family="Arial Black, Arial, sans-serif" font-size="21" fill="#34d399">Indian Premier League</text>
  <rect x="48" y="134" width="252" height="426" fill="url(#left)"/>
  <rect x="300" y="134" width="252" height="426" fill="url(#right)"/>
  <path d="M272 202c-34 95-34 192 0 292M328 202c34 95 34 192 0 292" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="7"/>
  <rect x="266" y="300" width="68" height="170" rx="24" fill="#eab308" transform="rotate(-20 300 385)"/>
