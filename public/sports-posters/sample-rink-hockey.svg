<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" role="img" aria-labelledby="title desc">
  <title id="title">Sports Posters rink hockey sample</title>
  <desc id="desc">A rink-style hockey poster sample with sport-specific ice markings, two team badges, venue, date, and time.</desc>
  <defs>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff8ff"/>
      <stop offset=".45" stop-color="#cfe9ff"/>
      <stop offset="1" stop-color="#0f4c81"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06121d"/>
      <stop offset="1" stop-color="#09243a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="900" rx="12" fill="url(#night)"/>
  <text x="36" y="55" font-family="Arial Black, Arial, sans-serif" font-size="25" fill="#eaf7ff">NHL</text>
  <text x="92" y="55" font-family="Arial, sans-serif" font-size="19" letter-spacing="7" fill="#a7d7ff">HOCKEY</text>
  <text x="560" y="55" text-anchor="end" font-family="Arial, sans-serif" font-size="20" fill="#fff">2026-04-28</text>
  <rect x="40" y="110" width="520" height="480" rx="30" fill="url(#ice)" stroke="#fff" stroke-width="6"/>
  <line x1="300" y1="110" x2="300" y2="590" stroke="#db1f2d" stroke-width="5" opacity=".65"/>
  <line x1="160" y1="110" x2="160" y2="590" stroke="#1d4ed8" stroke-width="5" opacity=".5"/>
  <line x1="440" y1="110" x2="440" y2="590" stroke="#1d4ed8" stroke-width="5" opacity=".5"/>
  <circle cx="300" cy="350" r="82" fill="none" stroke="#db1f2d" stroke-width="5" opacity=".55"/>
  <circle cx="300" cy="350" r="9" fill="#db1f2d"/>
  <circle cx="160" cy="220" r="44" fill="none" stroke="#db1f2d" stroke-width="4" opacity=".5"/>
  <circle cx="440" cy="480" r="44" fill="none" stroke="#db1f2d" stroke-width="4" opacity=".5"/>
  <circle cx="186" cy="352" r="88" fill="#003087" stroke="#fff" stroke-width="6"/>
  <text x="186" y="368" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="48" fill="#fff">BUF</text>
  <circle cx="414" cy="352" r="88" fill="#f6b21a" stroke="#111827" stroke-width="6"/>
  <text x="414" y="368" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="48" fill="#111827">BOS</text>
