  <text x="60" y="722" font-family="Arial Black, Arial, sans-serif" font-size="35" fill="#fff">Boston Bruins</text>
  <text x="60" y="758" font-family="Arial, sans-serif" font-size="20" fill="#a7d7ff">Round 1 | KeyBank Center | 23:00</text>
