<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" role="img" aria-labelledby="title desc">
  <title id="title">Sports Posters ticket stub football sample</title>
  <desc id="desc">A cream ticket-stub sports poster layout with league mark, two team crests, match title, venue, round, date, and time.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <pattern id="paper" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#f5efe0"/>
      <circle cx="3" cy="4" r="1" fill="#d8cdb8" opacity=".45"/>
      <circle cx="12" cy="12" r="1" fill="#dfd4be" opacity=".42"/>
    </pattern>
    <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="transparent"/>
      <circle cx="2" cy="2" r="1.2" fill="#151b26" opacity=".26"/>
    </pattern>
  </defs>
  <rect width="600" height="900" rx="8" fill="url(#paper)"/>
  <rect x="0" y="0" width="600" height="900" rx="8" fill="none" stroke="#d8c9ad" stroke-width="3"/>
  <line x1="0" y1="130" x2="600" y2="130" stroke="#172031" stroke-width="3"/>
  <path d="M58 34h50l34 24v53l-34 24H58L24 111V58z" fill="none" stroke="#172031" stroke-width="4"/>
  <text x="83" y="82" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="24" fill="#172031">PL</text>
  <text x="157" y="58" font-family="Arial Black, Arial, sans-serif" font-size="30" fill="#172031">English Premier League</text>
  <text x="158" y="91" font-family="Arial, sans-serif" font-size="18" letter-spacing="9" fill="#172031">FOOTBALL</text>
  <text x="534" y="76" text-anchor="end" font-family="Georgia, serif" font-style="italic" font-size="28" fill="#9b6d1f">2026-04-27</text>

  <g filter="url(#shadow)">
    <rect x="48" y="190" width="504" height="290" rx="6" fill="#141b29"/>
    <rect x="48" y="190" width="252" height="290" fill="#171717"/>
    <rect x="300" y="190" width="252" height="290" fill="#d61429"/>
    <rect x="48" y="190" width="504" height="290" fill="url(#dots)"/>
    <rect x="110" y="226" width="380" height="205" rx="22" fill="none" stroke="#efe7d0" stroke-width="4" opacity=".48"/>
    <line x1="300" y1="190" x2="300" y2="480" stroke="#0e1420" stroke-width="4"/>
    <circle cx="300" cy="333" r="54" fill="none" stroke="#efe7d0" stroke-width="3" opacity=".42"/>
    <rect x="68" y="210" width="130" height="54" fill="#121827"/>
    <text x="133" y="246" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="26" letter-spacing="7" fill="#fff">LIVE</text>
    <circle cx="193" cy="330" r="84" fill="#f5d000" stroke="#111827" stroke-width="8"/>
    <path d="M136 311c32-50 81-50 114 0 6 10 8 42-57 78-65-36-63-68-57-78z" fill="#d61429" stroke="#111827" stroke-width="5"/>
    <text x="193" y="340" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="32" fill="#fff" stroke="#111827" stroke-width="2">MUN</text>
    <circle cx="407" cy="330" r="84" fill="#fff" stroke="#111827" stroke-width="8"/>
    <circle cx="407" cy="330" r="61" fill="#d61429"/>
    <path d="M407 284l15 30 33 5-24 23 6 33-30-16-30 16 6-33-24-23 33-5z" fill="#111827"/>
    <text x="407" y="340" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="31" fill="#fff" stroke="#111827" stroke-width="2">BRE</text>
    <text x="300" y="365" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="86" fill="#fff" stroke="#000" stroke-width="9">V</text>
    <text x="193" y="435" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="19" fill="#fff">Manchester United</text>
    <text x="407" y="435" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="19" fill="#fff">Brentford</text>
  </g>

  <line x1="70" y1="532" x2="530" y2="532" stroke="#ad7a1f" stroke-width="5"/>
  <text x="70" y="612" font-family="Arial, sans-serif" font-size="55" fill="#111827">Manchester United vs</text>
  <text x="70" y="670" font-family="Arial, sans-serif" font-size="55" fill="#111827">Brentford</text>
  <text x="70" y="748" font-family="Arial Black, Arial, sans-serif" font-size="20" letter-spacing="10" fill="#ad7a1f">ROUND 34  2026-04-27</text>
  <text x="70" y="780" font-family="Georgia, serif" font-style="italic" font-size="28" fill="#172031">Round 34, Old Trafford, 19:00.</text>
  <line x1="70" y1="826" x2="530" y2="826" stroke="#ad7a1f" stroke-width="3"/>
  <text x="70" y="868" font-family="Arial Black, Arial, sans-serif" font-size="18" letter-spacing="8" fill="#172031">OLD TRAFFORD</text>
  <text x="530" y="868" text-anchor="end" font-family="Georgia, serif" font-style="italic" font-size="26" fill="#ad7a1f">19:00</text>
</svg>
