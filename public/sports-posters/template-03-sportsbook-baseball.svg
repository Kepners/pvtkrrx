    <style>@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;700&family=JetBrains+Mono:wght@400;500;700&display=swap');
.bebas { font-family: 'Bebas Neue', Impact, sans-serif; }
.mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
.sans { font-family: 'Inter', system-ui, sans-serif; }</style>
    <radialGradient id="bgRad" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#14181F"/>
