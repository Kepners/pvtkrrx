<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" role="img" aria-labelledby="title desc">
  <title id="title">Sports Posters fight card sample</title>
  <desc id="desc">A fight night poster sample with octagon linework, UFC text, main card, date, and source metadata.</desc>
  <defs>
    <radialGradient id="glow" cx=".5" cy=".42" r=".72">
      <stop offset="0" stop-color="#334155"/>
      <stop offset=".55" stop-color="#111827"/>
      <stop offset="1" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="bars" x1="0" x2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset=".5" stop-color="#111827"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
  </defs>
  <rect width="600" height="900" rx="16" fill="url(#glow)"/>
  <rect x="38" y="38" width="524" height="824" rx="18" fill="none" stroke="#fff" stroke-opacity=".12"/>
  <path d="M300 140l190 80v228l-190 112-190-112V220z" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="5"/>
  <path d="M300 178l154 65v182l-154 91-154-91V243z" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="3"/>
  <text x="300" y="255" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="90" fill="#fff">UFC</text>
  <rect x="76" y="308" width="448" height="76" fill="url(#bars)"/>
  <text x="300" y="358" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="31" fill="#fff">DEEP WATERS</text>
  <text x="300" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" letter-spacing="6" fill="#fbbf24">MAIN CARD</text>
  <text x="300" y="508" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="38" fill="#fff">Lightweight Feature</text>
  <rect x="72" y="600" width="456" height="120" rx="8" fill="#020617" stroke="#60a5fa" stroke-opacity=".34"/>
  <text x="96" y="648" font-family="Arial Black, Arial, sans-serif" font-size="27" fill="#fff">Prelims | Main Card | Post-Fight</text>
  <text x="96" y="690" font-family="Arial, sans-serif" font-size="22" fill="#c7d2fe">2026-04-29 | 3 sources | 11.3 GB</text>
  <line x1="72" y1="780" x2="528" y2="780" stroke="#dc2626" stroke-width="4"/>
  <text x="72" y="828" font-family="Arial Black, Arial, sans-serif" font-size="22" letter-spacing="6" fill="#fff">FIGHT CARD</text>
  <text x="528" y="828" text-anchor="end" font-family="Arial Black, Arial, sans-serif" font-size="20" fill="#60a5fa">SPORTSMETA</text>
