<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600" viewBox="0 0 400 600">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap');
.hero { font-family: 'Bebas Neue', Impact, sans-serif; }
.mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }</style>
    <radialGradient id="bgRad" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#E10600" stop-opacity="0.25"/>
      <stop offset="45%" stop-color="#111114"/>
      <stop offset="100%" stop-color="#050507"/>
    </radialGradient>
    <radialGradient id="bgRad2" cx="50%" cy="35%" r="60%">
