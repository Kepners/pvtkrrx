<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" role="img" aria-labelledby="title desc">
  <title id="title">Sports Posters neon motorsport sample</title>
  <desc id="desc">A black and red motorsport poster sample with a large F1-style mark, grand prix title, date, session, and 16:9 preview zone.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#070a12"/>
      <stop offset=".44" stop-color="#11182a"/>
      <stop offset="1" stop-color="#d30017"/>
    </linearGradient>
    <linearGradient id="flare" x1="0" x2="1">
      <stop offset="0" stop-color="#00f6ff"/>
      <stop offset=".5" stop-color="#fff"/>
      <stop offset="1" stop-color="#ff002f"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0v30" fill="none" stroke="#fff" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <rect width="600" height="900" rx="14" fill="url(#bg)"/>
  <rect width="600" height="900" rx="14" fill="url(#grid)"/>
  <path d="M-60 690C110 610 240 725 390 625c85-57 144-142 272-136" fill="none" stroke="#fff" stroke-opacity=".2" stroke-width="11"/>
  <path d="M-40 720C126 651 246 760 400 665c86-53 152-151 262-148" fill="none" stroke="#ffb21a" stroke-opacity=".42" stroke-width="6"/>
  <text x="44" y="60" font-family="Arial Black, Arial, sans-serif" font-size="18" letter-spacing="5" fill="#ffb21a">MOTORSPORT</text>
  <text x="44" y="92" font-family="Arial Black, Arial, sans-serif" font-size="36" fill="#fff">Formula 1</text>
  <text x="556" y="62" text-anchor="end" font-family="Arial, sans-serif" font-size="18" letter-spacing="4" fill="#fff">2026-04-29</text>
  <rect x="44" y="130" width="512" height="300" rx="10" fill="#050814" stroke="#fff" stroke-opacity=".2"/>
  <path d="M86 286h180c58 0 86-76 151-76h109" fill="none" stroke="url(#flare)" stroke-width="15" stroke-linecap="round"/>
  <path d="M88 323h205c60 0 86-55 148-55h88" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="8" stroke-linecap="round"/>
  <text x="300" y="326" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="118" fill="#fff" stroke="#0b0f1d" stroke-width="8">F1</text>
  <text x="300" y="472" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="40" fill="#fff">British Grand Prix</text>
  <text x="300" y="512" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" letter-spacing="5" fill="#ffb21a">QUALIFYING</text>
  <rect x="44" y="568" width="512" height="172" rx="8" fill="#080c18" stroke="#ff002f" stroke-opacity=".5"/>
  <text x="74" y="622" font-family="Arial Black, Arial, sans-serif" font-size="26" fill="#fff">Silverstone Circuit</text>
  <text x="74" y="665" font-family="Arial, sans-serif" font-size="24" fill="#cbd7f3">Session: Qualifying</text>
  <text x="74" y="705" font-family="Arial, sans-serif" font-size="24" fill="#cbd7f3">Round 12 | 15:00 BST</text>
  <line x1="44" y1="790" x2="556" y2="790" stroke="#ffb21a" stroke-width="3"/>
  <text x="44" y="836" font-family="Arial Black, Arial, sans-serif" font-size="24" letter-spacing="8" fill="#fff">SPORTSMETA</text>
  <text x="556" y="836" text-anchor="end" font-family="Arial, sans-serif" font-size="18" letter-spacing="4" fill="#9bdcff">MEMBER POSTER</text>
</svg>
