<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600" viewBox="0 0 400 600">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Inter:wght@400;700&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap');
.bebas { font-family: 'Bebas Neue', Impact, sans-serif; }
.mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
.sans { font-family: 'Inter', system-ui, sans-serif; }</style>
    <radialGradient id="homeGrad" cx="30%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="70%" stop-color="#E10600"/>
      <stop offset="100%" stop-color="#060810"/>
    </radialGradient>
    <radialGradient id="awayGrad" cx="70%" cy="60%" r="80%">
      <stop offset="0%" stop-color="#FF8000"/>
      <stop offset="70%" stop-color="#0090D0"/>
      <stop offset="100%" stop-color="#060810"/>
    </radialGradient>
    <linearGradient id="chrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#d8d8d8"/>
      <stop offset="55%" stop-color="#8a8a8a"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="lowerThird" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="35%" stop-color="rgba(0,0,0,0.85)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.95)"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="35%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.85)"/>
    </radialGradient>
    <pattern id="scanlines" x="0" y="0" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="rgba(255,255,255,0.04)"/>
    </pattern>
    <filter id="seamBlur"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="redGlow"><feGaussianBlur stdDeviation="1.5"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="vsShadow"><feGaussianBlur in="SourceAlpha" stdDeviation="3"/><feOffset dy="4"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="400" height="600" fill="#000"/>
  
    <polygon points="0,0 240.0,0 160.0,600 0,600" fill="url(#homeGrad)"/>
    <polygon points="240.0,0 400,0 400,600 160.0,600" fill="url(#awayGrad)"/>
    <!-- seam glow -->
    <line x1="170.0" y1="0" x2="230.0" y2="600" stroke="rgba(255,255,255,0.85)" stroke-width="3" filter="url(#seamBlur)" opacity="0.7"/>
  <rect width="400" height="600" fill="url(#scanlines)" style="mix-blend-mode:overlay"/>
  <rect width="400" height="600" fill="url(#vignette)"/>
  
    <g transform="translate(-10.0 90.0) scale(4.2)"
       fill="none" stroke="white" stroke-width="2.0"
       color="white" opacity="0.06">
      
        <path d="M10,60 L30,60 L40,48 L60,48 L70,60 L90,60 L90,68 L70,68 L60,76 L40,76 L30,68 L10,68 Z" fill="currentColor" stroke="none"/>
        <circle cx="30" cy="72" r="6" fill="currentColor" stroke="none"/>
        <circle cx="70" cy="72" r="6" fill="currentColor" stroke="none"/>
    
    </g>
  
    <g>
      <rect x="18" y="18" width="32" height="22" fill="none" stroke="white" stroke-width="1.2"/>
      <text class="bebas" x="34" y="34" text-anchor="middle" font-size="14" fill="white">F1</text>
      <text class="bebas" x="58" y="28" font-size="12" fill="white" letter-spacing="0.1em">FORMULA 1</text>
      <text class="mono" x="58" y="40" font-size="7" fill="white" opacity="0.65" letter-spacing="2.5">FORMULA 1</text>
      <circle cx="356" cy="28" r="3.5" fill="#ef4444" filter="url(#redGlow)"/>
      <text class="sans" x="366" y="32" font-size="9.5" font-weight="700" fill="white" letter-spacing="2">LIVE</text>
    </g>
  
    <text class="bebas" x="-8" y="320" font-size="220" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1" letter-spacing="-8">VER</text>
    <text class="bebas" x="408" y="540" text-anchor="end" font-size="220" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1" letter-spacing="-8">NOR</text>
  
    <g transform="translate(200.0 300.0)">
      <text class="bebas" x="0" y="22" text-anchor="middle" font-size="88" fill="url(#chrome)" letter-spacing="4" filter="url(#vsShadow)" transform="skewX(-12)">VS</text>
    </g>
    <text class="mono" x="200.0" y="398.0" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.85)" letter-spacing="2.5">— ROUND 12 —</text>
  
    <rect x="0" y="470" width="400" height="130" fill="url(#lowerThird)"/>
    <g fill="white">
      <text class="sans" x="18" y="534" font-size="9" font-weight="700" fill="#1E3A8A" letter-spacing="1.8">HOME</text>
      <text class="bebas" x="18" y="552" font-size="18" letter-spacing="1">Max Verstappen</text>
      <text class="sans" x="382" y="534" text-anchor="end" font-size="9" font-weight="700" fill="#FF8000" letter-spacing="1.8">AWAY</text>
      <text class="bebas" x="382" y="552" text-anchor="end" font-size="18" letter-spacing="1">Lando Norris</text>
    </g>
    <line x1="18" y1="562" x2="382" y2="562" stroke="rgba(255,255,255,0.4)" stroke-width="0.6"/>
    <text class="mono" x="18" y="578" font-size="9" fill="rgba(255,255,255,0.7)" letter-spacing="1.6">SILVERSTONE CIRCUIT</text>
    <text class="mono" x="382" y="578" text-anchor="end" font-size="9" fill="rgba(255,255,255,0.7)" letter-spacing="1.6">2026-07-04 · 16:00 BST</text>
</svg>