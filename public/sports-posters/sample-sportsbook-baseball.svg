<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" role="img" aria-labelledby="title desc">
  <title id="title">Sports Posters baseball sample</title>
  <desc id="desc">A clean baseball poster sample with diamond field geometry, team badges, match title, venue, date, and start time.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f1e2"/>
      <stop offset="1" stop-color="#dac8a6"/>
    </linearGradient>
    <pattern id="speckle" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1" fill="#b69c73" opacity=".32"/>
      <circle cx="13" cy="9" r="1" fill="#b69c73" opacity=".26"/>
    </pattern>
  </defs>
  <rect width="600" height="900" rx="10" fill="url(#card)"/>
  <rect width="600" height="900" rx="10" fill="url(#speckle)"/>
  <text x="46" y="54" font-family="Arial Black, Arial, sans-serif" font-size="23" fill="#0f172a">MLB</text>
  <text x="110" y="54" font-family="Arial, sans-serif" font-size="16" letter-spacing="8" fill="#0f172a">BASEBALL</text>
  <text x="555" y="54" text-anchor="end" font-family="Georgia, serif" font-style="italic" font-size="22" fill="#8a5f16">2026-04-28</text>
  <rect x="46" y="112" width="508" height="356" fill="#10251d"/>
  <path d="M300 166l165 150-165 150-165-150z" fill="#236b43" stroke="#f3e8c6" stroke-width="4"/>
  <path d="M300 236l87 80-87 80-87-80z" fill="#b87a38" opacity=".72"/>
  <circle cx="300" cy="316" r="13" fill="#f3e8c6"/>
  <rect x="84" y="192" width="160" height="160" rx="14" fill="#0b5f9e" stroke="#f3e8c6" stroke-width="4"/>
  <text x="164" y="285" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="58" fill="#fff">LAD</text>
  <rect x="356" y="192" width="160" height="160" rx="14" fill="#00a3e0" stroke="#111827" stroke-width="4"/>
  <text x="436" y="285" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="58" fill="#111827">MIA</text>
  <text x="300" y="305" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="64" fill="#fff" stroke="#111827" stroke-width="7">V</text>
  <line x1="70" y1="528" x2="530" y2="528" stroke="#9b6d1f" stroke-width="4"/>
  <text x="70" y="590" font-family="Arial Black, Arial, sans-serif" font-size="38" fill="#0f172a">Los Angeles Dodgers vs</text>
  <text x="70" y="638" font-family="Arial Black, Arial, sans-serif" font-size="38" fill="#0f172a">Miami Marlins</text>
  <text x="70" y="704" font-family="Georgia, serif" font-style="italic" font-size="26" fill="#172031">Round 6, Dodger Stadium, 02:10.</text>
  <line x1="70" y1="785" x2="530" y2="785" stroke="#9b6d1f" stroke-width="3"/>
  <text x="70" y="830" font-family="Arial Black, Arial, sans-serif" font-size="18" letter-spacing="6" fill="#172031">DODGER STADIUM</text>
  <text x="530" y="830" text-anchor="end" font-family="Georgia, serif" font-style="italic" font-size="24" fill="#9b6d1f">02:10</text>
</svg>
