<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PVTKRRX Loading</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .wrap {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #0b1520 0%, #020304 65%, #000 100%);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.92;
    }

    .label {
      position: absolute;
      bottom: 26px;
      left: 50%;
      transform: translateX(-50%);
      color: #b7d2dc;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(0, 255, 65, 0.25);
      padding: 8px 12px;
      border-radius: 8px;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <video autoplay muted loop playsinline>
      <source src="./assets/splash.mp4" type="video/mp4">
    </video>
    <div class="label">Starting PVTKRRX</div>
  </div>
</body>
</html>
