<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PVTKRRX</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'JetBrains Mono', monospace;
      background: transparent;
      color: #e0e0e0;
      -webkit-app-region: no-drag;
      user-select: none;
    }

    .window {
      width: 100%;
      height: 100%;
      position: relative;
      background: rgba(10, 10, 10, 0.93);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(0, 255, 65, 0.16);
      border-radius: 12px;
      overflow: hidden;
      box-shadow:
        0 10px 34px rgba(0, 0, 0, 0.62),
        0 0 1px rgba(0, 255, 65, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-3px) scale(0.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .window::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 1px,
        rgba(0, 0, 0, 0.03) 1px,
        rgba(0, 0, 0, 0.03) 2px
      );
      pointer-events: none;
      z-index: 20;
    }

    .drag-bar {
      -webkit-app-region: drag;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid rgba(0, 255, 65, 0.08);
    }

    .drag-bar::after {
      content: '';
      width: 34px;
      height: 3px;
      background: rgba(255, 255, 255, 0.16);
      border-radius: 2px;
    }

    .content {
      height: calc(100% - 20px);
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 10px;
      padding: 10px;
      position: relative;
      z-index: 10;
    }

    .panel {
      border: 1px solid rgba(0, 255, 65, 0.08);
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.22);
      box-shadow: 0 0 12px rgba(0, 255, 65, 0.08);
      min-height: 0;
    }

    .left {
      display: grid;
      grid-template-rows: auto auto auto auto auto;
      gap: 8px;
      padding: 10px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 6px 6px 2px;
    }

    .logo-container {
      width: 76px;
      height: 76px;
      filter: drop-shadow(0 0 14px rgba(0, 128, 255, 0.26));
    }

    .logo-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 8px;
    }

    .app-name {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #f8f7ff;
      text-shadow: 0 0 10px rgba(248, 247, 255, 0.22);
      position: relative;
    }

    .app-name::before,
    .app-name::after {
      content: 'PVTKRRX';
      position: absolute;
      top: 0;
      left: 0;
    }

    .app-name::before {
      color: #FF0040;
      opacity: 0.5;
      z-index: -1;
      animation: glitch-r 3s infinite;
    }

    .app-name::after {
      color: #0080FF;
      opacity: 0.5;
      z-index: -2;
      animation: glitch-b 3s infinite;
    }

    @keyframes glitch-r {
      0%, 92%, 100% { transform: translate(0); }
      93% { transform: translate(2px, -1px); }
      96% { transform: translate(-1px, 1px); }
    }

    @keyframes glitch-b {
      0%, 92%, 100% { transform: translate(0); }
      94% { transform: translate(-2px, 1px); }
      97% { transform: translate(1px, -1px); }
    }

    .version {
      font-size: 10px;
      color: #626262;
      letter-spacing: 1px;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid rgba(0, 255, 65, 0.16);
      background: rgba(0, 255, 65, 0.05);
      box-shadow: 0 0 12px rgba(0, 255, 65, 0.11);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00FF41;
      box-shadow: 0 0 8px rgba(0, 255, 65, 0.6);
      animation: pulse 2s ease-in-out infinite;
      flex-shrink: 0;
    }

    .status-dot.stopped {
      background: #FF0040;
      box-shadow: 0 0 8px rgba(255, 0, 64, 0.6);
      animation: none;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 8px rgba(0, 255, 65, 0.6); }
      50% { opacity: 0.65; box-shadow: 0 0 14px rgba(0, 255, 65, 0.42); }
    }

    .status-label {
      font-size: 12px;
      font-weight: 600;
      color: #00FF41;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(0, 255, 65, 0.35);
    }

    .status-label.stopped {
      color: #FF0040;
    }

    .status-port {
      margin-left: auto;
      font-size: 11px;
      color: #646464;
    }

    .status-port span {
      color: #8ab0bb;
    }

    .quick-links {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.03);
      color: #8ab0bb;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 0 8px rgba(138, 176, 187, 0.08);
    }

    .icon-btn svg {
      width: 13px;
      height: 13px;
      fill: currentColor;
    }

    .icon-btn:hover {
      color: #00FF41;
      border-color: rgba(0, 255, 65, 0.35);
      background: rgba(0, 255, 65, 0.06);
      box-shadow: 0 0 14px rgba(0, 255, 65, 0.18);
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 9px 12px;
      border: none;
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
      -webkit-app-region: no-drag;
    }

    .btn-configure {
      background: linear-gradient(135deg, rgba(0, 128, 255, 0.16), rgba(64, 112, 118, 0.2));
      color: #0080FF;
      border: 1px solid rgba(0, 128, 255, 0.25);
      box-shadow: 0 0 12px rgba(0, 128, 255, 0.16);
    }

    .btn-configure:hover {
      background: linear-gradient(135deg, rgba(0, 128, 255, 0.26), rgba(64, 112, 118, 0.34));
      border-color: rgba(0, 128, 255, 0.5);
      box-shadow: 0 0 18px rgba(0, 128, 255, 0.28);
      color: #cfe9ff;
    }

    .btn-quit {
      background: rgba(255, 0, 64, 0.06);
      color: #8b8b8b;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 0 10px rgba(255, 0, 64, 0.08);
    }

    .btn-quit:hover {
      background: rgba(255, 0, 64, 0.12);
      color: #FF0040;
      border-color: rgba(255, 0, 64, 0.22);
      box-shadow: 0 0 14px rgba(255, 0, 64, 0.2);
    }

    .credit {
      text-align: center;
      font-size: 9px;
      color: #6e8a92;
      letter-spacing: 0.6px;
      line-height: 1.45;
      text-shadow: 0 0 8px rgba(0, 128, 255, 0.16);
      margin-top: 2px;
    }

    .credit .brand {
      display: block;
      color: #8ab0bb;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 1px;
      text-shadow: 0 0 8px rgba(138, 176, 187, 0.22);
    }

    .right {
      padding: 10px;
      display: flex;
      min-height: 0;
    }

    .path-card {
      width: 100%;
      height: 100%;
      border-radius: 10px;
      border: 1px solid rgba(0, 255, 65, 0.08);
      background: rgba(0, 0, 0, 0.35);
      box-shadow: 0 0 14px rgba(0, 255, 65, 0.08);
      padding: 12px;
      display: grid;
      grid-template-rows: auto auto auto auto auto auto;
      gap: 8px;
      min-height: 0;
    }

    .path-title {
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #8ab0bb;
      text-shadow: 0 0 8px rgba(138, 176, 187, 0.24);
    }

    .path-current {
      font-size: 12px;
      color: #c8d7db;
      line-height: 1.35;
      min-height: 36px;
      max-height: 54px;
      overflow: auto;
      word-break: break-all;
      padding-right: 2px;
    }

    .path-input {
      width: 100%;
      border-radius: 7px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(0, 0, 0, 0.45);
      color: #e0e0e0;
      padding: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
    }

    .path-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .path-btn {
      border-radius: 7px;
      border: 1px solid rgba(0, 128, 255, 0.25);
      background: rgba(0, 128, 255, 0.12);
      color: #0080FF;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 9px 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 0 10px rgba(0, 128, 255, 0.16);
    }

    .path-btn:hover {
      border-color: rgba(0, 128, 255, 0.5);
      background: rgba(0, 128, 255, 0.2);
      color: #cfe9ff;
      box-shadow: 0 0 14px rgba(0, 128, 255, 0.28);
    }

    .path-btn.secondary {
      border-color: rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.04);
      color: #a5acaf;
      box-shadow: 0 0 8px rgba(154, 160, 163, 0.1);
    }

    .path-btn.secondary:hover {
      border-color: rgba(255, 255, 255, 0.22);
      color: #d0d5d8;
    }

    .path-note {
      font-size: 11px;
      color: #6f6f6f;
      min-height: 16px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="window">
    <div class="drag-bar"></div>

    <div class="content">
      <div class="panel left">
        <div class="brand">
          <div class="logo-container">
            <img src="./assets/logo.ico" alt="PVTKRRX logo">
          </div>
          <div class="app-name">PVTKRRX</div>
          <div class="version">v1.0.0</div>
        </div>

        <div class="status-row">
          <div class="status-dot" id="statusDot"></div>
          <span class="status-label" id="statusLabel">Running</span>
          <span class="status-port" id="statusPort">port <span>7000</span></span>
        </div>

        <div class="quick-links">
          <button class="icon-btn" onclick="openProwlarr()" title="Open Prowlarr">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v9a3 3 0 0 1-3 3h-5.2l-3.6 3.2a1 1 0 0 1-1.7-.7V18H6a3 3 0 0 1-3-3V6zm4 2h10v2H7V8zm0 4h7v2H7v-2z"/></svg>
            Prowlarr
          </button>
          <button class="icon-btn" onclick="openQbit()" title="Open qBittorrent">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 2a8 8 0 0 1 7.8 6h-3.2a5 5 0 0 0-9.2 0H4.2A8 8 0 0 1 12 4zm0 16a8 8 0 0 1-7.8-6h3.2a5 5 0 0 0 9.2 0h3.2A8 8 0 0 1 12 20zm-2-8a2 2 0 1 1 2 2 2 2 0 0 1-2-2z"/></svg>
            qBittorrent
          </button>
        </div>

        <div class="actions">
          <button class="btn btn-configure" id="btnConfigure" onclick="openConfigure()">Open Configure</button>
          <button class="btn btn-quit" id="btnQuit" onclick="quitApp()">Quit</button>
        </div>

        <div class="credit">
          <span class="brand">PVTKRRX</span>
          (c) 2026 PVTKRRX | Technology by ChoppedOnions.xyz
        </div>
      </div>

      <div class="panel right">
        <div class="path-card">
          <div class="path-title">qBittorrent Download Path</div>
          <div class="path-current" id="currentPath">Loading...</div>
          <input class="path-input" id="pathInput" placeholder="C:\\Downloads\\Media">
          <div class="path-buttons">
            <button class="path-btn" onclick="saveDownloadPath()">Save Path</button>
            <button class="path-btn secondary" onclick="openDownloadFolder()">Open Folder</button>
          </div>
          <div class="path-buttons">
            <button class="path-btn secondary" onclick="refreshDownloadPath()">Refresh</button>
            <span></span>
          </div>
          <div class="path-note" id="pathNote"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function openConfigure() {
      if (window.electronAPI) {
        window.electronAPI.openConfigure();
      } else {
        window.open('/configure', '_blank');
      }
    }

    function openProwlarr() {
      if (!window.electronAPI) return;
      window.electronAPI.openProwlarr().catch(() => {});
    }

    function openQbit() {
      if (!window.electronAPI) return;
      window.electronAPI.openQbit().catch(() => {});
    }

    function quitApp() {
      if (window.electronAPI) {
        window.electronAPI.quit();
      } else {
        window.close();
      }
    }

    function setStatus(running, port) {
      const dot = document.getElementById('statusDot');
      const label = document.getElementById('statusLabel');
      const portEl = document.getElementById('statusPort');

      if (running) {
        dot.className = 'status-dot';
        label.className = 'status-label';
        label.textContent = 'Running';
        portEl.innerHTML = 'port <span>' + port + '</span>';
        portEl.style.display = '';
      } else {
        dot.className = 'status-dot stopped';
        label.className = 'status-label stopped';
        label.textContent = 'Stopped';
        portEl.style.display = 'none';
      }
    }

    function setVersion(version) {
      document.querySelector('.version').textContent = 'v' + version;
    }

    function setPathNote(text, isError = false) {
      const el = document.getElementById('pathNote');
      el.textContent = text || '';
      el.style.color = isError ? '#FF6A8A' : '#6f6f6f';
    }

    async function refreshDownloadPath() {
      const current = document.getElementById('currentPath');
      const input = document.getElementById('pathInput');
      try {
        if (!window.electronAPI) throw new Error('Desktop bridge not available');
        const data = await window.electronAPI.getDownloadPath();
        const savePath = (data && data.savePath) ? data.savePath : '';
        current.textContent = savePath || 'Not configured';
        if (!input.value.trim()) input.value = savePath || '';
        setPathNote('Path synced');
      } catch (err) {
        current.textContent = 'Unavailable';
        setPathNote(err.message || 'Failed to read path', true);
      }
    }

    async function saveDownloadPath() {
      const input = document.getElementById('pathInput');
      const value = input.value.trim();
      if (!value) return setPathNote('Enter a valid folder path', true);
      try {
        if (!window.electronAPI) throw new Error('Desktop bridge not available');
        const data = await window.electronAPI.setDownloadPath(value);
        const savePath = data?.savePath || value;
        document.getElementById('currentPath').textContent = savePath;
        input.value = savePath;
        setPathNote('Download path updated');
      } catch (err) {
        setPathNote(err.message || 'Failed to update path', true);
      }
    }

    async function openDownloadFolder() {
      const current = document.getElementById('currentPath').textContent;
      const input = document.getElementById('pathInput').value.trim();
      const target = (input || current || '').trim();
      if (!target || target === 'Unavailable' || target === 'Not configured' || target === 'Loading...') {
        return setPathNote('No folder path available', true);
      }
      try {
        if (!window.electronAPI) throw new Error('Desktop bridge not available');
        await window.electronAPI.openDownloadFolder(target);
        setPathNote('Opened folder');
      } catch (err) {
        setPathNote(err.message || 'Failed to open folder', true);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      refreshDownloadPath();
      setInterval(refreshDownloadPath, 15000);
    });

    window.popupAPI = { setStatus, setVersion };
  </script>
</body>
</html>
